name: CI

on:
  pull_request:
    branches: [main, devel, "release/**"]

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint (${{ matrix.ros_distro }})
    runs-on: ${{ matrix.runner }}
    container: ros:${{ matrix.ros_distro }}-ros-base
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: humble
            runner: ubuntu-22.04
          - ros_distro: jazzy
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install lint tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ros-${{ matrix.ros_distro }}-ament-cpplint \
            ros-${{ matrix.ros_distro }}-ament-flake8 \
            ros-${{ matrix.ros_distro }}-ament-pep257 \
            ros-${{ matrix.ros_distro }}-ament-uncrustify \
            ros-${{ matrix.ros_distro }}-ament-xmllint \
            cppcheck

      - name: ament_cpplint
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          ament_cpplint wmx_r2_package/src wmx_r2_package/include
          ament_cpplint wmx_r2_control/src wmx_r2_control/include

      - name: ament_uncrustify
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          ament_uncrustify wmx_r2_package/src wmx_r2_package/include
          ament_uncrustify wmx_r2_control/src wmx_r2_control/include

      - name: ament_flake8 (launch + tests)
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          ament_flake8 wmx_r2_package/launch wmx_r2_package/test
          ament_flake8 wmx_r2_control/launch

      - name: ament_pep257 (launch + tests)
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          ament_pep257 wmx_r2_package/launch wmx_r2_package/test
          ament_pep257 wmx_r2_control/launch

      - name: ament_xmllint (package.xml)
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          ament_xmllint wmx_r2_package/package.xml wmx_r2_message/package.xml
          ament_xmllint wmx_r2_control/package.xml \
            wmx_r2_control/wmx_r2_control_plugin.xml

      - name: cppcheck (warnings only, never fails the job)
        run: |
          cppcheck --enable=warning,style --inline-suppr \
            --suppress=missingIncludeSystem --error-exitcode=0 \
            wmx_r2_package/src wmx_r2_control/src

  build-messages:
    name: Build wmx_r2_message (${{ matrix.ros_distro }})
    runs-on: ${{ matrix.runner }}
    container: ros:${{ matrix.ros_distro }}-ros-base
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: humble
            runner: ubuntu-22.04
          - ros_distro: jazzy
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/wmx-r2

      - name: rosdep install
        run: |
          apt-get update
          rosdep update --rosdistro ${{ matrix.ros_distro }}
          rosdep install --from-paths src --ignore-src -y \
            --rosdistro ${{ matrix.ros_distro }} \
            --skip-keys "wmx_r2_package movensys_navigation_description movensys_manipulator_description"

      - name: colcon build
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          colcon build --packages-select wmx_r2_message \
            --event-handlers console_cohesion+

      - name: colcon test (message interfaces only)
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          source install/setup.bash
          colcon test --packages-select wmx_r2_message \
            --event-handlers console_cohesion+
          colcon test-result --verbose

      - name: Generated interfaces are usable
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          source install/setup.bash
          ros2 interface show wmx_r2_message/srv/SetNodeState
          ros2 interface show wmx_r2_message/srv/EcatScanNetwork

  launch-descriptions:
    name: Launch descriptions (${{ matrix.ros_distro }})
    runs-on: ${{ matrix.runner }}
    container: ros:${{ matrix.ros_distro }}-ros-base
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: humble
            runner: ubuntu-22.04
          - ros_distro: jazzy
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The WMX3 SDK is not available in CI, so the nodes cannot be built here.
      # Evaluating the launch descriptions still catches the mistakes that break
      # a real launch: undefined launch configurations, parameter files that do
      # not exist, lifecycle nodes declared without a namespace, and a launch
      # file whose node count is not the one recorded in the script.
      - name: Evaluate launch descriptions
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          python3 .github/scripts/check_launch_descriptions.py
