# controllers_file for stream_position:=true cyclic_subsample:=hermite (see doc/launch_manipulator.md).
# The arm controller claims [position, velocity]: the hardware samples the (position, velocity) cubic once per
# engine cycle into the cyclic buffer (see cyclic_stream_timing.hpp, "HERMITE SUB-SAMPLING").
# interpolate_from_desired_state: a new trajectory starts from the last *commanded* state, not the feedback.
# The feedback lags the streamed command by the buffer runway (~20 ms) plus servo lag, so splicing from it while
# moving would step the command backwards (review 2026-10-13); needed for streamed replanning (MPC).
controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    movensys_manipulator_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

movensys_manipulator_arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    interpolate_from_desired_state: true
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5
