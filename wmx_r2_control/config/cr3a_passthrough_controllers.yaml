# Same controller name as cr3a_controllers.yaml, so MoveIt's controller config is unchanged.
# The arm trajectory goes to WMX as one CSpline per goal, like the native joint_trajectory_controller.
controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    movensys_manipulator_arm_controller:
      type: wmx_r2_control/PassthroughTrajectoryController

    movensys_manipulator_gripper_controller:
      type: position_controllers/GripperActionController

movensys_manipulator_arm_controller:
  ros__parameters:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    constraints:
      goal_time: 0.0

# Only spawned with use_gripper:=true. Action: ~/gripper_cmd (control_msgs/action/GripperCommand).
movensys_manipulator_gripper_controller:
  ros__parameters:
    joint: picker_1_joint
    goal_tolerance: 0.002
