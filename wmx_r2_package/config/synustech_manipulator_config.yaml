# Synustech mobile manipulator: SIASUN DUCO GCR30-1100 arm on WMX axes 2 to 7.
# WMX axes 0 and 1 are the drive wheels of the mobile base and are left alone
# by every node here. The six arm joints map joint1..joint6 -> axes 2..7.
# No gripper.

joint_state_broadcaster:
  ros__parameters:
    joint_feedback_rate: 100
    joint_axes: [2, 3, 4, 5, 6, 7]
    joint_name: ["joint1", "joint2", "joint3", "joint4", "joint5", "joint6"]
    encoder_joint_topic: /joint_states
    isaacsim_joint_topic: /isaacsim/joint_command
    gazebo_joint_topic: /gazebo_position_controller/commands

joint_trajectory_controller:
  ros__parameters:
    joint_axes: [2, 3, 4, 5, 6, 7]
    joint_trajectory_action: /movensys_manipulator_arm_controller/follow_joint_trajectory
    wmx_param_file_path: ""  # resolved at launch time via get_package_share_directory

joint_position_controller:
  ros__parameters:
    joint_axes: [2, 3, 4, 5, 6, 7]
    joint_name: ["joint1", "joint2", "joint3", "joint4", "joint5", "joint6"]
    joint_trajectory_topic: /movensys_manipulator_arm_controller/joint_trajectory
    accel_ratio: 0.3
    default_velocity: 0.5
    min_step: 0.001

# Buffered alternative to joint_position_controller: MoveIt Servo setpoints are
# recorded into the WMX3 API buffer and replayed under the RT OS at cycle
# boundaries. Selected with `use_api_buffer:=true`; only one of the two nodes
# may run, since they subscribe to the same topic.
# NOTE: these values are copied from the CR5A and have not been tuned for the
# GCR30's reach and inertia (30 kg payload, 64 kg arm). Re-run api_buffer_probe
# and re-tune before use.
servo_stream_controller:
  ros__parameters:
    joint_axes: [2, 3, 4, 5, 6, 7]
    # Order matters: axis[0] determines LinearIntplProfileCalcMode for the
    # whole interpolation.
    joint_name: ["joint1", "joint2", "joint3", "joint4", "joint5", "joint6"]
    joint_trajectory_topic: /movensys_manipulator_arm_controller/joint_trajectory

    api_buffer_channel: 0
    estop_buffer_channel: 1      # watch trigger routine; must differ from the above
    # 320 bytes/setpoint with no pacing block, so 1 MB holds ~3200. The channel
    # is a ring and reclaims space as blocks execute, so this does not bound how
    # long a stream can run.
    api_buffer_size_mb: 1

    # No queue, no pacing loop: one StartLinearIntplPos block per setpoint,
    # executed as soon as it lands, overriding its predecessor mid-flight.
    # queue_depth should read 0-1; anything standing above that means the engine
    # is not keeping up.
    #
    # nominal_period_us is the time each segment is given to cover its
    # distance, which is what sets commanded velocity. Set it to Servo's actual
    # publish period (config/synustech/servo.yaml in movensys-manipulator).
    nominal_period_us: 25000     # = Servo publish_period 0.025 s

    starvation_timeout_ms: 75    # 3x nominal period -> controlled stop
    accel_ratio: 0.3             # accel phase spans 30% of a segment; retune with the surge data
    # Single ceiling for all six axes, so it must fit the slowest joints.
    # DUCO GCR30-1100 datasheet: J1, J2 120 deg/s (2.09 rad/s), J3 180 deg/s,
    # J4-J6 225 deg/s.
    max_joint_velocity: 2.09
    min_step_rad: 1.0e-6         # below this a setpoint is a hold and is not recorded
    # Terminal velocity per segment as a fraction of its path velocity. Kept at
    # 0 (decelerate to rest) until nominal_period_us has been measured against
    # this setup's worst-case setpoint gap. See the CR5A config for the reason.
    end_velocity_ratio: 0.0
    stop_on_error: true          # stop rather than skip a rejected setpoint
