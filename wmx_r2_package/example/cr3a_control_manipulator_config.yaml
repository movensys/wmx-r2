gripper_controller:
  ros__parameters:
    wmx_gripper_topic: /wmx/set_gripper
    gripper_address: [0, 0]
    pre_setup_io: true

wmx_engine_node:
  ros__parameters:
    core: -1           
    affinity_mask: 0  
    
wmx_core_motion_node:
  ros__parameters:
    axes_status_rate: 100
    jog_timeout_ms: 200.0
    jog_run_time_ms: 2000.0
    jog_jerk_ratio: 0.75
    motion_controllers:
      - movensys_manipulator_arm_controller
    controller_resync_period: 0.2

wmx_lifecycle_manager_node:
  ros__parameters:
    managed_nodes:
      - wmx_core_motion_node
      - wmx_io_node
      - wmx_ethercat_node
      - gripper_controller
    discovery_period: 1.0
